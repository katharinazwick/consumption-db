<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/marvel.css">
    <title>Marvel Cinematic Universe</title>
</head>
<body class="marvel">
<header class="page-header">
    <h1>Marvel Cinematic Universe</h1>
    <nav>
        <a href="index.html">Library</a>
        <a href="marvel.html" aria-current="page">Marvel Cinematic Universe</a>
    </nav>
</header>

<div class="toolbar">
    <div class="toolbar-left">
        <select id="chooseUniversum" aria-label="Universe"></select>
    </div>
    <div class="toolbar-right">
        <button id="toAdd" type="button" class="btn btn-primary">add movie</button>
    </div>
</div>

<main>
    <div id="tableHead" class="row head"></div>
    <div id="table"></div>
</main>

<div class="overlay" id="addOverlay">
    <form class="dialog" id="addForm" onsubmit="return false">
        <h3>New entry</h3>
        <input id="titleInput" placeholder="title *" autocomplete="off">
        <input id="dateInput" placeholder="year" inputmode="numeric" class="short">
        <p class="form-hint">Position in each universe (leave empty if not part of it)</p>
        <div id="universumInputs" class="position-grid"></div>
        <div class="dialog-actions">
            <button type="button" class="btn" data-close>close</button>
            <button type="button" class="btn btn-primary" id="saveInput">save</button>
        </div>
    </form>
</div>

<script type="module" src="js/pages/marvel/main.js"></script>
</body>
</html>
