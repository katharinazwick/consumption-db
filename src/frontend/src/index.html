<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
    <link rel="stylesheet" href="css/main.css">
    <title>Media database</title>
</head>
<body class="library">
<header class="page-header">
    <h1>Media database</h1>
    <nav>
        <a href="index.html" aria-current="page">Library</a>
        <a href="marvel.html">Marvel Cinematic Universe</a>
    </nav>
</header>

<div class="toolbar">
    <div class="toolbar-left">
        <div class="filter-wrap">
            <button id="filterToggle" type="button" class="btn" aria-expanded="false" aria-controls="filterPanel">
                Filter <span id="filterCount" class="badge" hidden></span>
            </button>
            <div id="filterPanel" class="popover"></div>
        </div>
        <div id="activeFilters" class="chips"></div>
    </div>
    <div class="toolbar-right">
        <select id="sort" aria-label="Sort"></select>
        <button id="toAdd" type="button" class="btn btn-primary">add movie</button>
        <button id="toAddActor" type="button" class="btn btn-primary">add actor</button>
    </div>
</div>

<main>
    <div id="tableHead" class="row head"></div>
    <div id="table"></div>
</main>

<!-- Dialog: neuer Eintrag -->
<div class="overlay" id="addOverlay">
    <form class="dialog" id="addForm" onsubmit="return false">
        <h3>New entry</h3>
        <input id="titleInput" placeholder="title *" autocomplete="off">
        <textarea id="descriptionInput" placeholder="description" rows="4"></textarea>
        <input id="viewingYearInput" placeholder="viewing year" inputmode="numeric" class="short">
        <div class="form-row">
            <select id="typInput" aria-label="Type"></select>
            <select id="streamInput" aria-label="Stream"></select>
        </div>
        <label class="check"><input type="checkbox" id="incompleteBox"> incomplete or needs review</label>
        <label class="check"><input type="checkbox" id="favouriteBox"> favourite</label>
        <div class="dialog-actions">
            <button type="button" class="btn" data-close>close</button>
            <button type="button" class="btn btn-primary" id="saveInput">save</button>
        </div>
    </form>
</div>

<!-- Dialog: neuer Schauspieler -->
<div class="overlay" id="actorOverlay">
    <div class="dialog">
        <h3>New actor</h3>
        <div class="suggest-wrap">
            <input id="actorNameInput" placeholder="name *" autocomplete="off">
            <div id="actorSuggestions" class="suggestions"></div>
        </div>
        <small id="actorHint"></small>
        <div id="actorMovies"></div>
        <button type="button" id="addMovieSelect" class="btn btn-ghost">+ movie</button>
        <div class="dialog-actions">
            <button type="button" class="btn" data-close>close</button>
            <button type="button" class="btn btn-primary" id="saveActor">save</button>
        </div>
    </div>
</div>

<script type="module" src="js/pages/media/main.js"></script>
</body>
</html>
