<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>database for media consumption</title>
    <link rel="stylesheet" href="style/index.css">
</head>

<body>
<div>
    <h1 id ="firstHeader">database for media consumption</h1>
</div>

<footer style="margin-top: 40px; text-align: center; font-size: 0.9em;">
    <p><a href="marvel.html">Marvel Cinemativ Universum</a></p>
</footer>

<div class="toolbar">
    <div class="filters">
        <select id="chooseStream">
            <option value="">stream</option>
            <option>Disney</option>
            <option>Netflix</option>
            <option>Amazon</option>
            <option>Spotify</option>
            <option>Sonstiges</option>
        </select>

        <select id="chooseTyp">
            <option value="">typ</option>
            <option>movie</option>
            <option>serie</option>
            <option>audiobook</option>
            <option>tale</option>
        </select>

        <select id="incomplete">
            <option value="">status</option>
            <option value="false">incomplete</option>
            <option value="true">complete</option>
        </select>

        <select id="favourite">
            <option value="">relationship</option>
            <option value="true">favourite</option>
            <option value="false">not favourite</option>
        </select>

        <select id="actor">
            <option>actor</option>
        </select>

        <select id="sort">
            <option>title ascending</option>
            <option>title descending</option>
            <option>viewingyear ascending</option>
            <option>viewingyear descending</option>
        </select>
    </div>
        <button id="toAdd">add movie</button>
        <button id="toAddActor">add actor</button>
</div>

<!--popup-->
<div class="popup-overlay" id="popupOverlay">
    <div class="popup">
        <h3>create a new input</h3>
        <div id="field"></div>
        <div id="label">
            <select id="typInput">
                <option>movie</option>
                <option>serie</option>
                <option>audiobook</option>
                <option>tale</option>
            </select>
            <select id="streamInput">
                <option value="" selected>stream</option>
                <option>Disney</option>
                <option>Netflix</option>
                <option>Amazon</option>
                <option>Spotify</option>
                <option>Sonstiges</option>
            </select>
            <label for="box">incomplete or need for review:</label>
            <input type="checkbox" id="box" class="box"></input>
            <label for="secondBox">favourite:</label>
            <input type="checkbox" id="secondBox" class="box"></input>
        </div>
        <p></p>
        <button id="close">close</button>
        <button id="saveInput">save</button>
    </div>
</div>

<!--popup actor-->
<div class="popup-overlay" id="actorOverlay">
    <div class="popup">
        <h3>create a new actor</h3>
        <div class="suggestWrap">
            <input id="actorNameInput" placeholder="name *" autocomplete="off">
            <div id="actorSuggestions" class="suggestions"></div>
        </div>
        <small id="actorHint"></small>
        <div id="actorMovies"></div>
        <button id="addMovieSelect" type="button">+ movie</button>
        <p></p>
        <button id="closeActor">close</button>
        <button id="saveActor">save</button>
    </div>
</div>


<p></p>

<div id="container"></div>
<p></p>
<div id="table">
</div>



<!-- JavaScript-Datei einbinden -->
<script type="module" src="table/createHeader.js"></script>
<script type="module" src="popup/createPopup.js"></script>
<script type="module" src="popup/openPopUp.js"></script>
<script type="module" src="popup/getDatasFromActorPopup.js"></script>
<script type="module" src="popup/actorPopUp.js"></script>
<script type="module" src="index.js"></script>
<script type="module" src="table/actorFilter.js"></script>
</body>
</html>
