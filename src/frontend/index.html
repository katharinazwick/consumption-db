<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>database for media consumption</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
<div>
    <h1>database for media consumption</h1>
</div>

<div class="toolbar">
    <div class="filters">
        <select id="chooseStream">
            <option value="">stream</option>
            <option>Disney</option>
            <option>Netflix</option>
            <option>Amazon</option>
            <option>Festplatte</option>
        </select>

        <select id="chooseTyp">
            <option value="">typ</option>
            <option>movie</option>
            <option>serie</option>
            <option>audiobook</option>
            <option>tale</option>
        </select>

        <select id="incomplete">
            <option value="">all</option>
            <option value="true">incomplete</option>
        </select>

        <select id="sort">
            <option>sort</option>
            <option>viewing Year ascending</option>
            <option>viewing Year descending</option>
        </select>
    </div>
    <button id="toAdd">to add</button>
</div>

<!--popup-->
<div class="popup-overlay" id="popupOverlay">
    <div class="popup">
        <h3>create a new input</h3>
        <div id="field"></div>
        <div id="label">
            <select id="typInput">
                <option>movie</option>
                <option>serie</option>
                <option>audiobook</option>
                <option>tale</option>
            </select>
            <select id="streamInput">
                <option value="" selected>stream</option>
                <option>Disney</option>
                <option>Netflix</option>
                <option>Amazon</option>
                <option>Spotify</option>
                <option>Festplatte</option>
            </select>
            <label for="box">incomplete or need for review:</label>
            <input type="checkbox" id="box" class="box"></input>
        </div>
        <p></p>
        <button id="close">close</button>
        <button id="saveInput">save</button>
    </div>
</div>

<p></p>

<div id="container"></div>
<p></p>
<div id="table">
</div>

<!-- JavaScript-Datei einbinden -->
<script type="module" src="createHeader.js"></script>
<script type="module" src="createPopup.js"></script>
<script type="module" src="openPopUp.js"></script>
<script type="module" src="getDatasFromPopup.js"></script>
<script type="module" src="index.js"></script>
</body>
</html>
